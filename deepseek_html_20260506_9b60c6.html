<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Неожиданный сюрприз 🎵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        
        .container {
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(255,0,0,0.3);
        }
        
        h1 {
            color: #ff3366;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,51,102,0.5);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        p {
            color: white;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .video-link {
            display: inline-block;
            padding: 15px 30px;
            background: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .video-link:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        
        .rickroll-gif {
            width: 200px;
            height: 150px;
            margin: 20px auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .rickroll-gif img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #countdown {
            font-size: 24px;
            color: #ffaa00;
            margin-top: 20px;
        }
        
        .button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .footer {
            color: #888;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="rickroll-gif">
            <img src="https://media.giphy.com/media/3o7abB06u9bNzA8LC8/giphy.gif" alt="Rick Roll">
        </div>
        <h1>🎵 YOU GOT RICKROLL'D! 🎵</h1>
        <p>Никогда не дам тебе забыть эту песню...</p>
        <a href="https://rutube.ru/video/c6cc4d620b1d4338901770a44b3e82f4/" target="_blank" class="video-link">
            🎬 Нажми сюда для сюрприза 🎬
        </a>
        <div id="countdown"></div>
        <button class="button" onclick="startRickRoll()">🎵 Включить рикролл 🎵</button>
        <div class="footer">
            Rick Astley - Never Gonna Give You Up (Remastered 4K 60fps)
        </div>
    </div>

    <script>
        // Функция для воспроизведения рикролла
        function rickroll() {
            window.location.href = "https://rutube.ru/video/c6cc4d620b1d4338901770a44b3e82f4/";
        }
        
        // Таймер обратного отсчёта
        let timeLeft = 10;
        const countdownElement = document.getElementById('countdown');
        
        function updateCountdown() {
            countdownElement.innerHTML = `Автоматический рикролл через ${timeLeft} секунд...`;
            timeLeft--;
            
            if (timeLeft < 0) {
                clearInterval(timer);
                rickroll();
            }
        }
        
        // Запуск таймера
        const timer = setInterval(updateCountdown, 1000);
        
        // Функция ручного запуска
        function startRickRoll() {
            clearInterval(timer);
            rickroll();
        }
        
        // Предотвращение выхода (забавный эффект)
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = 'Ты пытаешься сбежать от Рика Эстли? Никогда не сдавайся!';
            return 'Ты пытаешься сбежать от Рика Эстли? Никогда не сдавайся!';
        });
        
        console.log("%c🎵 NEVER GONNA GIVE YOU UP! 🎵", "color: #ff3366; font-size: 20px;");
        console.log("%cRick Roll Activated! (Rutube Link)", "color: #ff0000; font-size: 16px;");
    </script>
</body>
</html>
